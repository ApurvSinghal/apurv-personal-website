name: Daily X (Twitter) Post

on:
  schedule:
    # Runs at 23:00 UTC every day (9:00 AM Melbourne / AEST)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run simulation mode (do not post to X)"
        required: false
        type: boolean
        default: false
      custom_topic:
        description: "Override topic pillar (e.g., 'Applied AI & Systems')"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  publish-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Execute X Daily Poster
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.custom_topic }}" ]; then
            ARGS="$ARGS --force-topic \"${{ github.event.inputs.custom_topic }}\""
          fi
          node --no-warnings scripts/x-poster/index.ts $ARGS
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit history and queue updates
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/x-history.json content/x-queue.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(bot): record published X post and update queue [skip ci]"
            git push origin main || echo "::warning::Direct git push to main was blocked by branch protection. Please allow github-actions[bot] to bypass branch protection in repository settings."
          else
            echo "No content changes to commit."
          fi
