name: Daily X (Twitter) Post

on:
  schedule:
    # Runs at 23:00 UTC every day (9:00 AM Melbourne / AEST)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run simulation mode (do not post to X)"
        required: false
        type: boolean
        default: false
      send_email:
        description: "Send technical briefing email (even during dry-run simulation)"
        required: false
        type: boolean
        default: true
      custom_topic:
        description: "Override topic pillar (e.g., 'Applied AI & Systems')"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  publish-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Secret Configuration
        run: |
          echo "### 🔑 Actions Secrets Diagnostic" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | Status | Impact |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          [ -n "${{ secrets.X_API_KEY }}" ] && echo "| \`X_API_KEY\` | ✅ Configured | Live tweet publishing enabled |" >> $GITHUB_STEP_SUMMARY || echo "| \`X_API_KEY\` | ❌ Missing | Live tweet publishing disabled |" >> $GITHUB_STEP_SUMMARY
          [ -n "${{ secrets.GEMINI_API_KEY }}" ] && echo "| \`GEMINI_API_KEY\` | ✅ Configured | Gemini 2.5 / 3.x generation active |" >> $GITHUB_STEP_SUMMARY || echo "| \`GEMINI_API_KEY\` | ⚠️ Missing | Using curated fallback posts |" >> $GITHUB_STEP_SUMMARY
          [ -n "${{ secrets.RESEND_API_KEY }}" ] && echo "| \`RESEND_API_KEY\` | ✅ Configured | Email briefing delivery active |" >> $GITHUB_STEP_SUMMARY || echo "| \`RESEND_API_KEY\` | ⚠️ Missing | Briefing email will be skipped |" >> $GITHUB_STEP_SUMMARY
          
          echo "=== SECRETS DIAGNOSTIC ==="
          [ -n "${{ secrets.X_API_KEY }}" ] && echo "✓ X_API_KEY: Configured" || echo "✗ X_API_KEY: Missing"
          [ -n "${{ secrets.GEMINI_API_KEY }}" ] && echo "✓ GEMINI_API_KEY: Configured" || echo "⚠ GEMINI_API_KEY: Missing"
          [ -n "${{ secrets.RESEND_API_KEY }}" ] && echo "✓ RESEND_API_KEY: Configured" || echo "⚠ RESEND_API_KEY: Missing"
          echo "=========================="

      - name: Execute X Daily Poster
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.custom_topic }}" ]; then
            ARGS="$ARGS --force-topic \"${{ github.event.inputs.custom_topic }}\""
          fi
          node --no-warnings scripts/x-poster/index.ts $ARGS
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          CONTACT_NOTIFICATION_EMAIL: ${{ secrets.CONTACT_NOTIFICATION_EMAIL }}
          SEND_EMAIL_IN_DRY_RUN: ${{ github.event.inputs.send_email || 'true' }}

      - name: Commit history and queue updates
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "ApurvSinghal"
          git config --global user.email "apurv.singhal28@gmail.com"
          git add content/x-history.json content/x-queue.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record published X post and update queue [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No content changes to commit."
          fi
